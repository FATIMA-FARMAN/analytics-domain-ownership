name: dbt CI (PR checks)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt (DuckDB)
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.10.2" "dbt-duckdb==1.10.2"

      - name: Create CI profiles.yml (DuckDB)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          analytics_domain_ownership:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/ado_ci.duckdb
                threads: 4
          EOF

      - name: dbt deps
        run: |
          dbt deps --project-dir domains/people_analytics

      - name: dbt build (CI)
        run: |
          dbt build --project-dir domains/people_analytics
