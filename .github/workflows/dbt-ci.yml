name: dbt CI (PR checks)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt (DuckDB)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Create CI profiles.yml (DuckDB)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILES'
          people_analytics_dbt:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/people_analytics_ci.duckdb
                threads: 4
          PROFILES

      - name: dbt deps
        working-directory: domains/people_analytics
        run: dbt deps

      - name: dbt parse (CI)
        working-directory: domains/people_analytics
        run: dbt parse
