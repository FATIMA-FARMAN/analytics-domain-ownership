version: 2

sources:
  - name: raw_hiring
    description: "Raw hiring data from source systems"
    database: core-rhythm-462516-n5
    schema: raw
    
    tables:
      - name: hiring_events
        description: "Raw hiring event stream"
        
        # Freshness check
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        loaded_at_field: created_at
        
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
